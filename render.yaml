services:
  - type: web
    name: pano-tour-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CONVEX_STORAGE_URL
        sync: false
      - key: CONVEX_STORAGE_TOKEN
        sync: false
